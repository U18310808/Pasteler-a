   <div class="contacto">
  <h1 class="title text-center">Contáctanos</h1>

  <form id="formContacto" class="formulario">
  
  <input type="text" id="nombre" placeholder="Nombre" required>

  <input type="email" id="email" placeholder="Correo" required>

  <input type="tel" id="celular" placeholder="Celular" required>

  <input type="text" id="ruc" placeholder="RUC" required>

  <textarea id="mensaje" placeholder="Escribe tu mensaje" rows="4" required></textarea>

  <button type="submit">Enviar</button>

</form>

  <p id="respuesta" class="text-center"></p>
</div>
  <footer class="text-center">
    Derechos Reservados Milis Pasteleria | 2026 | peru
  </footer>
</div>
<script>
document.getElementById("formContacto").addEventListener("submit", function(e) {
  e.preventDefault();

  let nombre = document.getElementById("nombre").value;
  let email = document.getElementById("email").value;
  let celular = document.getElementById("celular").value;
  let ruc = document.getElementById("ruc").value;
  let mensaje = document.getElementById("mensaje").value;

  if(nombre === "" || email === "" || celular === "" || ruc === "" || mensaje === "") {
    alert("Completa todos los campos");
    return;
  }

  document.getElementById("respuesta").innerText =
    "Mensaje enviado correctamente ✅";

  this.reset();
});
</script>
</body>
